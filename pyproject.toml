[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = false
strict_optional = true

# Per-module overrides for external libs without stubs
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "ttkbootstrap",
    "imageio_ffmpeg",
]
ignore_missing_imports = true

# New modules - basic type checking
[[tool.mypy.overrides]]
module = [
    "yadisk_downloader.config.*",
    "yadisk_downloader.events.*",
    "yadisk_downloader.plugins.*",
    "yadisk_downloader.di.*",
    "yadisk_downloader.core.auth",
    "yadisk_downloader.core.cache",
    "yadisk_downloader.core.parallel_hls",
    "yadisk_downloader.core.safety",
    "yadisk_downloader.core.folder",
    "yadisk_downloader.state",
]
disallow_untyped_defs = true
check_untyped_defs = true

# Legacy modules - basic checking only
[[tool.mypy.overrides]]
module = [
    "yadisk_downloader.core.*",
    "yadisk_downloader.gui",
    "yadisk_downloader.cli",
    "yadisk_downloader.queue",
    "yadisk_downloader.scheduler",
    "yadisk_downloader.notify",
    "yadisk_downloader.utils",
]
warn_unused_ignores = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["yadisk_downloader"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]
per-file-ignores = { "tests/*" = ["T201", "T203"], "build.py" = ["T201"], "run.py" = ["T201"], "yadisk_downloader/cli.py" = ["T201"], "yadisk_downloader/__main__.py" = ["T201"], "yadisk_downloader/scheduler.py" = ["T201"], "yadisk_downloader/setup_wizard.py" = ["T201"], "yadisk_downloader/gui.py" = ["T201"], "yadisk_downloader/queue.py" = ["T201"] }  # CLI output is the product

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["yadisk_downloader"]